[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airlock-agent"
version = "0.2.0"
description = "Terminal-first cross-agent coding review and repair loop"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jashen" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/jayshen1031/airlock"
Repository = "https://github.com/jayshen1031/airlock"
Issues = "https://github.com/jayshen1031/airlock/issues"
Security = "https://github.com/jayshen1031/airlock/security/advisories/new"

[project.scripts]
airlock = "airlock.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
